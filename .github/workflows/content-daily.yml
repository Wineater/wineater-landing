name: Daily content drafts

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Articles to draft in this run'
        default: '2'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: content-daily
  cancel-in-progress: false

jobs:
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Continue the rolling drafts branch if it exists
        run: |
          if git ls-remote --exit-code --heads origin content/daily-drafts >/dev/null 2>&1; then
            git fetch origin content/daily-drafts
            git checkout -B content/daily-drafts origin/content/daily-drafts
            git -c user.name=github-actions -c user.email=actions@github.com merge --no-edit origin/main || git merge --abort
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Check prerequisites and review backlog
        id: gate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::Secret GEMINI_API_KEY is not set (Settings > Secrets and variables > Actions). Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          unreviewed=$(grep -l '^reviewed: false' content/blog/*.md 2>/dev/null | wc -l | tr -d ' ')
          echo "Unreviewed drafts waiting: $unreviewed"
          if [ "$unreviewed" -ge 10 ]; then
            echo "::notice::10 or more drafts are waiting for review. Skipping this run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate drafts
        if: steps.gate.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          CONTENT_MAX_TOKENS_PER_RUN: '600000'
        run: npm run content:daily -- --limit "${{ inputs.limit || '2' }}"

      - name: Open or update the review pull request
        if: steps.gate.outputs.skip != 'true'
        id: pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          branch: content/daily-drafts
          base: main
          add-paths: |
            content/blog/**
            data/content/**
          commit-message: 'content: new article drafts'
          title: 'Content: article drafts for review'
          body: |
            Drafts generated by the daily content workflow. Every article is `draft: true` and
            `reviewed: false`, so nothing goes live by merging this pull request.

            Before publishing an article: edit it, check every number against its source link,
            add first-hand experience, then run `npm run content:approve -- <slug> --by "Name"`.

      - name: Summary
        if: steps.gate.outputs.skip != 'true'
        run: |
          {
            echo "### Daily content drafts"
            echo "Pull request: ${{ steps.pr.outputs.pull-request-url || 'not created (enable Settings > Actions > General > Allow GitHub Actions to create and approve pull requests); the branch content/daily-drafts was still updated' }}"
            echo
            tail -n 5 data/content/runs.jsonl 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
